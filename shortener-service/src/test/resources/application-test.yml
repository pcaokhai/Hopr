server:
  port: 8081

spring:
  application:
    name: shortener-service
  cloud:
    config:
      enabled: false
  config:
    import: ""
  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    keyspace-name: hopr
    local-datacenter: datacenter1
    schema-action: none

  data:
    redis:
      host: localhost
      port: 6379
      password: test
      client-type: lettuce
      timeout: 6
      cluster:
        nodes:
          - 127.0.0.1:6379
          - 127.0.0.1:6379
          - 127.0.0.1:6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: 127.0.0.1:9092

shortener:
  domain: http://localhost:80/
  api-key:
    # SHA-256 digests of the literals `test-api-key` and `test-api-key-2`, mapped to two
    # distinct owners so the tests can prove one owner's links are invisible to the other.
    owners: >-
      4c806362b613f7496abf284146efd31da90e4b16169fe001841ca17290f427c4:owner-a,
      c6029e4ce1e44050a0b8f478634ee3b12bee28fb58d1e142249309f8f8d73163:owner-b

keygen:
  service:
    url: http://localhost:8081
