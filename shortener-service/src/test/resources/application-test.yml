server:
  port: 8081

spring:
  application:
    name: shortener-service
  cloud:
    config:
      enabled: false
  config:
    import: ""
  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    keyspace-name: hopr
    local-datacenter: datacenter1
    schema-action: none

  data:
    redis:
      host: localhost
      port: 6379
      password: test
      client-type: lettuce
      timeout: 6
      cluster:
        nodes:
          - 127.0.0.1:6379
          - 127.0.0.1:6379
          - 127.0.0.1:6379

  cache:
    type: redis

shortener:
  domain: http://localhost:80/
  api-key:
    # SHA-256 of the literal `test-api-key` used by the API key tests.
    hashes: 4c806362b613f7496abf284146efd31da90e4b16169fe001841ca17290f427c4

keygen:
  service:
    url: http://localhost:8081
