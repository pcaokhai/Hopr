server:
  port: 8081

spring:
  application:
    name: shortener-service
  cloud:
    config:
      enabled: false
  config:
    import: ""
  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    keyspace-name: hopr
    local-datacenter: datacenter1
    schema-action: none
  data:
    redis:
      host: localhost
      port: 6379
      password: test
      client-type: lettuce
      timeout: 6
      cluster:
        nodes:
          - 127.0.0.1:6379
          - 127.0.0.1:6379
          - 127.0.0.1:6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: 127.0.0.1:9092