services:
  # -------------------- API Gateway --------------------
  api-gateway:
    image: nginx:latest
    container_name: hopr-api-gateway
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - shortener-service
      - resolver-service
    networks:
      - default

  # -------------------- Local MongoDB --------------------
  mongodb:
    image: mongo:7.0
    container_name: hopr-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: Hopr
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - default

  # -------------------- Redis Cluster (6 Nodes) --------------------
  redis-node-1:
    image: redis:latest
    container_name: hopr-redis-node-1
    volumes:
      - ./data/redis-1:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-1
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7001:6379"
      - "17001:16379"
    networks:
      - default

  redis-node-2:
    image: redis:latest
    container_name: hopr-redis-node-2
    volumes:
      - ./data/redis-2:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-2
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7002:6379"
      - "17002:16379"
    networks:
      - default

  redis-node-3:
    image: redis:latest
    container_name: hopr-redis-node-3
    volumes:
      - ./data/redis-3:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-3
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7003:6379"
      - "17003:16379"
    networks:
      - default

  redis-node-4:
    image: redis:latest
    container_name: hopr-redis-node-4
    volumes:
      - ./data/redis-4:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-4
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7004:6379"
      - "17004:16379"
    networks:
      - default

  redis-node-5:
    image: redis:latest
    container_name: hopr-redis-node-5
    volumes:
      - ./data/redis-5:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-5
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7005:6379"
      - "17005:16379"
    networks:
      - default

  redis-node-6:
    image: redis:latest
    container_name: hopr-redis-node-6
    volumes:
      - ./data/redis-6:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-6
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7006:6379"
      - "17006:16379"
    networks:
      - default

  # Tự động kết nối 6 node thành Redis Cluster (chỉ chạy 1 lần lúc start)
  redis-cluster-init:
    image: redis:latest
    container_name: hopr-redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    restart: "no"
    command: >
      sh -c "sleep 3 &&
             echo 'yes' | redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 --cluster-replicas 1 || true"
    networks:
      - default

  # -------------------- Spring Boot Microservices --------------------
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: hopr/config-server:latest
    container_name: hopr-config-server
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    networks:
      - default

  keygen-service:
    build:
      context: ./keygen-service
      dockerfile: Dockerfile
    image: hopr/keygen-service:latest
    container_name: hopr-keygen-service
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - config-server
    networks:
      - default

  shortener-service:
    build:
      context: ./shortener-service
      dockerfile: Dockerfile
    image: hopr/shortener-service:latest
    container_name: hopr-shortener-service
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - keygen-service
      - mongodb
      - redis-cluster-init
    networks:
      - default

  resolver-service:
    build:
      context: ./resolver-service
      dockerfile: Dockerfile
    image: hopr/resolver-service:latest
    container_name: hopr-resolver-service
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    env_file:
      - .env
    ports:
      - "8083:8083"
    depends_on:
      - config-server
      - mongodb
      - redis-cluster-init
    networks:
      - default

networks:
  default:
    driver: bridge
