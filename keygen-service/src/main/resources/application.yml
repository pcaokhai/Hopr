spring:
  application:
    name: keygen-service
---
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:http://config-server:8888"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
