version: '3.8'

services:
  api-gateway:
    image: nginx:latest
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - default

  # -------------------- Redis Clusters----------------------------------------

  redis-node-1:
    image: redis:latest
    volumes:
      - ./data/redis-1:/data/redis
    depends_on:
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-1
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7001:6379"
      - "17001:16379"
    networks:
      - default
    deploy:
      replicas: 1

  redis-node-2:
    image: redis:latest
    volumes:
      - ./data/redis-2:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-2
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7002:6379"
      - "17002:16379"
    networks:
      - default
    deploy:
      replicas: 1

  redis-node-3:
    image: redis:latest
    volumes:
      - ./data/redis-3:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-3
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7003:6379"
      - "17003:16379"
    networks:
      - default
    deploy:
      replicas: 1

  redis-node-4:
    image: redis:latest
    volumes:
      - ./data/redis-4:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-4
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7004:6379"
      - "17004:16379"
    networks:
      - default
    deploy:
      replicas: 1

  redis-node-5:
    image: redis:latest
    volumes:
      - ./data/redis-5:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-5
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7005:6379"
      - "17005:16379"
    networks:
      - default
    deploy:
      replicas: 1

  redis-node-6:
    image: redis:latest
    volumes:
      - ./data/redis-6:/data/redis
    command: >
      redis-server --port 6379
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --cluster-announce-ip redis-node-6
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    ports:
      - "7006:6379"
      - "17006:16379"
    networks:
      - default
    deploy:
      replicas: 1

  # -------------------- Local MongoDB --------------------

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: Hopr
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - default
    deploy:
      replicas: 1
      resources:
        reservations:
          memory: 512M
          cpus: '0.5'

  config-server:
    image: hopr/config-server:latest
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    deploy:
      resources:
        reservations:
          memory: 512M
          cpus: '0.5'
      mode: replicated
      replicas: 1
    networks:
      - default

  shortener-service:
    image: hopr/shortener-service:latest
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    env_file:
      - .env
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          memory: 1G
          cpus: '0.5'
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  resolver-service:
    image: hopr/resolver-service:latest
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    env_file:
      - .env
    ports:
      - '8083:8083'
    deploy:
      resources:
        reservations:
          memory: 1G
          cpus: '0.5'
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  keygen-service:
    image: hopr/keygen-service:latest
    environment:
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=25.0"
    env_file:
      - .env
    ports:
      - "8081:8081"
    deploy:
      resources:
        reservations:
          memory: 1G
          cpus: '0.5'
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

networks:
  default:
    driver: overlay
    attachable: true