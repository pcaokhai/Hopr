namespace: hopr

image:
  tag: local
  pullPolicy: Never

mongodb:
  image: mongo:7.0
  rootUsername: root
  rootPassword: password
  database: Hopr

scylladb:
  image: scylladb/scylla:6.2
  # Three replicas so replication_factor 3 (see db-migration V1) has three homes.
  replicas: 3
  smp: 1
  memory: 1G
  # Container memory request/limit: --memory is Seastar's budget; the extra ~1G
  # covers non-Seastar allocations (JMX, tooling) so the pod is not OOMKilled.
  memoryLimit: 2G
  storage: 5Gi
  # Left unset so the chart deploys on any cluster's default provisioner.
  # The chart runs Scylla in production mode (no --developer-mode), whose
  # environment checks expect an XFS data volume: for a real deployment set this
  # to an XFS-backed StorageClass (and/or bake io_properties into the image).
  # On an ext4 default class the filesystem check is a startup error, and the
  # first-boot iotune run on a cpu-capped pod can take many minutes.
  storageClassName: ""

redis:
  # Must match the release name used for `helm install <name> bitnami/redis-cluster`
  releaseName: hopr-redis
  port: "6379"
  password: ""
  timeout: "6000"
  nodeCount: 6

config:
  shortenerServerPort: "8080"
  resolverServerPort: "8083"
  keygenServerPort: "8081"
  shortenerDomain: "http://localhost:8888/"
