namespace: hopr

image:
  tag: local
  pullPolicy: Never

scylladb:
  image: scylladb/scylla:6.2
  port: "9042"
  # Keyspace created by db-migration's V1 migration.
  keyspace: hopr
  # Scylla's default snitch reports a single datacenter under this name; the driver
  # requires it explicitly so it can route requests to local-DC replicas.
  datacenter: datacenter1
  # Three replicas so replication_factor 3 (see db-migration V1) has three homes.
  replicas: 3
  smp: 1
  memory: 1G
  # Container memory request/limit: --memory is Seastar's budget; the extra ~1G
  # covers non-Seastar allocations (JMX, tooling) so the pod is not OOMKilled.
  memoryLimit: 2G
  storage: 5Gi
  # Left unset so the chart deploys on any cluster's default provisioner.
  # The chart runs Scylla in production mode (no --developer-mode), whose
  # environment checks expect an XFS data volume: for a real deployment set this
  # to an XFS-backed StorageClass (and/or bake io_properties into the image).
  # On an ext4 default class the filesystem check is a startup error, and the
  # first-boot iotune run on a cpu-capped pod can take many minutes.
  storageClassName: ""

redis:
  # Must match the release name used for `helm install <name> bitnami/redis-cluster`
  releaseName: hopr-redis
  port: "6379"
  password: ""
  timeout: "6000"
  nodeCount: 6

urlServices:
  # shortener-service and resolver-service open a CqlSession against keyspace hopr at
  # boot, so deploy.sh installs the chart once with this off, migrates, then turns it on.
  enabled: true

config:
  shortenerServerPort: "8080"
  resolverServerPort: "8083"
  keygenServerPort: "8081"
  shortenerDomain: "http://localhost:8888/"
  # Comma-separated SHA-256 digests of the keys accepted on POST /shorten. Digest of the
  # local development key `hopr-local-dev-key`; override per environment with your own:
  #   KEY=$(openssl rand -hex 32); printf %s "$KEY" | shasum -a 256
  shortenerApiKeyHashes: "6e324a82022ddfc1cfd82d12a1888affe6b14af3672a750ee2cd21fa1934ccea"
