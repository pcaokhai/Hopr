{{- if .Values.urlServices.enabled }}
{{- /*
An Argo Rollouts Rollout, not a Deployment. A plain RollingUpdate replaces every pod on a
fixed schedule as soon as each new pod passes its own readiness probe -- a probe that only
says "this process started", not "this version is healthy under real traffic". A Rollout's
canary strategy sends a controlled slice of live traffic to the new version, holds there,
and lets an operator (or, later, an automated analysis) abort before the remaining pods are
replaced. See k8s/README.md for how to drive and observe one.

Traffic splitting here is replica-ratio based: with no service mesh and no ingress
traffic-router configured, Argo Rollouts approximates `setWeight: 20` by running ~20% of
the pods on the new ReplicaSet behind the same Service. That is coarser than true
per-request weighting -- at 1 replica the first step already means 50% of pods -- but it
needs nothing this repo does not already run. A real weighted canary would need
nginx-ingress canary annotations or a mesh (`spec.strategy.canary.trafficRouting`).

The pauses are timed, not manual: k8s/deploy.sh runs unattended and an indefinite
`pause: {}` would wedge it. `kubectl argo rollouts promote` still skips a pause early, and
`abort`/`undo` still roll back mid-canary. An automated `analysis:` step querying Phase 2's
Prometheus metrics is the natural next step and is deliberately not here: nothing in this
chart runs a Prometheus server for an AnalysisTemplate to query yet.

Argo Rollouts skips the canary steps entirely on the initial rollout (there is no previous
version to canary against), so a fresh `helm install` comes up at full replicas immediately;
the steps run on every subsequent image change.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: resolver-service
  namespace: {{ .Values.namespace }}
spec:
  # An HPA (see hpa.yaml below) manages replica count from here on; this is only the
  # starting point before the HPA's first scaling decision.
  replicas: {{ .Values.resolverService.replicaCount }}
  strategy:
    canary:
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
  selector:
    matchLabels:
      app: resolver-service
  template:
    metadata:
      labels:
        app: resolver-service
    spec:
      # Must exceed the app's own drain budget (5s preStop + spring.lifecycle
      # .timeout-per-shutdown-phase=20s in config-repo/application.yml); the kubelet
      # SIGKILLs at this limit no matter how much draining is left.
      terminationGracePeriodSeconds: 30
      {{- include "hopr.topologySpreadConstraints" (dict "app" "resolver-service" "root" $) | nindent 6 }}
      containers:
        - name: resolver-service
          image: "hopr/resolver-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.resolverServerPort }}
          env:
            # eclipse-temurin:25-jre is container-aware by default; cap the heap at a
            # share of the container memory *limit* below, leaving room for metaspace,
            # thread stacks and native buffers.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          envFrom:
            - configMapRef:
                name: hopr-config
            - secretRef:
                name: hopr-secret
          resources:
            {{- toYaml .Values.resolverService.resources | nindent 12 }}
          # Removing a pod from the Service endpoints and telling it to shut down happen
          # in parallel, and ingress-nginx needs a moment to observe the removal. Without
          # this pause the pod starts refusing connections while nginx is still routing to
          # it, turning a graceful shutdown into connection-refused errors. Sleeping in
          # preStop delays SIGTERM long enough for the deregistration to propagate.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.config.resolverServerPort }}
            failureThreshold: 12
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.config.resolverServerPort }}
            initialDelaySeconds: 25
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.config.resolverServerPort }}
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: resolver-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: resolver-service
  ports:
    - port: {{ .Values.config.resolverServerPort }}
      targetPort: {{ .Values.config.resolverServerPort }}
{{- end }}
