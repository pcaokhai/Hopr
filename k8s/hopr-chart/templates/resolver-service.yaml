{{- if .Values.urlServices.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolver-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  # The start-first rolling update the old Swarm stack.yml asked for: bring the new pod
  # up and Ready before any old pod goes away. maxUnavailable: 0 states that at every
  # replica count rather than relying on 25%-of-1 rounding to zero.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: resolver-service
  template:
    metadata:
      labels:
        app: resolver-service
    spec:
      # Must exceed the app's own drain budget (5s preStop + spring.lifecycle
      # .timeout-per-shutdown-phase=20s in config-repo/application.yml); the kubelet
      # SIGKILLs at this limit no matter how much draining is left.
      terminationGracePeriodSeconds: 30
      containers:
        - name: resolver-service
          image: "hopr/resolver-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.resolverServerPort }}
          envFrom:
            - configMapRef:
                name: hopr-config
            - secretRef:
                name: hopr-secret
          # Removing a pod from the Service endpoints and telling it to shut down happen
          # in parallel, and ingress-nginx needs a moment to observe the removal. Without
          # this pause the pod starts refusing connections while nginx is still routing to
          # it, turning a graceful shutdown into connection-refused errors. Sleeping in
          # preStop delays SIGTERM long enough for the deregistration to propagate.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.config.resolverServerPort }}
            failureThreshold: 12
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.config.resolverServerPort }}
            initialDelaySeconds: 25
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.config.resolverServerPort }}
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: resolver-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: resolver-service
  ports:
    - port: {{ .Values.config.resolverServerPort }}
      targetPort: {{ .Values.config.resolverServerPort }}
{{- end }}
