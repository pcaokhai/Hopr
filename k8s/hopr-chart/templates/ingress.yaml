apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hopr-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # TLS terminates at the ingress controller, which then talks plain HTTP to the Services
    # over the cluster network. Plain HTTP from outside is 308-redirected to HTTPS.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, PUT, DELETE"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # The frontend sits behind this ingress so its /api/shorten route -- which holds
          # the server-side API key -- is rate limited per real client address by the
          # limit-rps annotation above. The redirect regex below is anchored and excludes
          # these prefixes, so it cannot claim them; /shorten keeps its Exact path and the
          # `/` Prefix fallback still goes to shortener-service.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.config.frontendPort }}
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.config.frontendPort }}
          - path: /
            pathType: Exact
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.config.frontendPort }}
          - path: /shorten
            pathType: Exact
            backend:
              service:
                name: shortener-service
                port:
                  number: {{ .Values.config.shortenerServerPort }}
          # ponytail: a regex location is evaluated before every prefix location, so this
          # has to exclude the reserved literals itself. Anchored at both ends like the
          # gateway's `^/[a-zA-Z0-9_-]{4,}$` -- the controller compiles a regex path into
          # `^<path>` itself, and the API server rejects a path that does not start with
          # `/`, so only the `$` is written here. Unanchored it would claim
          # `/dashboard/<slug>` by matching a segment mid-path, and without the trailing `$`
          # it would claim every frontend asset under `/_next/`. The lookahead covers the
          # slash-free literals the anchors cannot. Upgrade path: split into two Ingress objects (one Exact,
          # one regex) if more reserved literal paths are added later.
          - path: /(?!shorten$|dashboard$)[a-zA-Z0-9_-]{4,}$
            pathType: ImplementationSpecific
            backend:
              service:
                name: resolver-service
                port:
                  number: {{ .Values.config.resolverServerPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortener-service
                port:
                  number: {{ .Values.config.shortenerServerPort }}
