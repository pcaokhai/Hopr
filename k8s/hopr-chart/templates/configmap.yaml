apiVersion: v1
kind: ConfigMap
metadata:
  name: hopr-config
  namespace: {{ .Values.namespace }}
data:
  {{- range $i := until (int .Values.redis.nodeCount) }}
  REDIS_NODE_{{ add $i 1 }}: "{{ $.Values.redis.releaseName }}-redis-cluster-{{ $i }}.{{ $.Values.redis.releaseName }}-redis-cluster-headless:6379"
  {{- end }}
  SCYLLA_CONTACT_POINTS: "{{ range $i := until (int .Values.scylladb.replicas) }}{{ if $i }},{{ end }}hopr-scylladb-{{ $i }}.hopr-scylladb{{ end }}"
  SCYLLA_PORT: {{ .Values.scylladb.port | quote }}
  SCYLLA_KEYSPACE: {{ .Values.scylladb.keyspace | quote }}
  SCYLLA_DATACENTER: {{ .Values.scylladb.datacenter | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_TIMEOUT: {{ .Values.redis.timeout | quote }}
  SPRING_CACHE_TYPE: "redis"
  KAFKA_BOOTSTRAP_SERVERS: "hopr-kafka:9092"
  SHORTENER_SERVER_PORT: {{ .Values.config.shortenerServerPort | quote }}
  RESOLVER_SERVER_PORT: {{ .Values.config.resolverServerPort | quote }}
  KEYGEN_SERVER_PORT: {{ .Values.config.keygenServerPort | quote }}
  SHORTENER_DOMAIN: {{ .Values.config.shortenerDomain | quote }}
  # SHA-256 digests of the API keys accepted on POST /shorten -- digests, not keys, so this
  # belongs in the ConfigMap rather than hopr-secret. The plaintext keys live with the clients.
  SHORTENER_API_KEY_HASHES: {{ .Values.config.shortenerApiKeyHashes | quote }}
