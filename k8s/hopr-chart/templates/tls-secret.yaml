# The certificate the ingress controller terminates TLS with. In local development this is
# self-signed material minted by k8s/deploy.sh and passed in with `helm --set-file`, so it
# is never committed. Both Ingresses have host-less rules, so the controller serves them from
# its catch-all server, which takes its certificate from --default-ssl-certificate
# (k8s/deploy.sh points it at hopr/hopr-tls) rather than from an Ingress `tls:` block.
# A real deployment would instead let cert-manager create this Secret from a CA-issued
# certificate (see "TLS" in k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: hopr-tls
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "tls.crt is required: pass it with --set-file (k8s/deploy.sh does)" .Values.tls.crt | b64enc }}
  tls.key: {{ required "tls.key is required: pass it with --set-file (k8s/deploy.sh does)" .Values.tls.key | b64enc }}
