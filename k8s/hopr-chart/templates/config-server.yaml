apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: {{ .Values.namespace }}
spec:
  # The start-first rolling update the old Swarm stack.yml asked for: bring the new pod
  # up and Ready before any old pod goes away. maxUnavailable: 0 states that at every
  # replica count rather than relying on 25%-of-1 rounding to zero.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: {{ .Values.configServer.replicaCount }}
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      # Must exceed the app's own drain budget (spring.lifecycle
      # .timeout-per-shutdown-phase=20s in config-server's application.yml); the kubelet
      # SIGKILLs at this limit no matter how much draining is left.
      terminationGracePeriodSeconds: 30
      containers:
        - name: config-server
          image: "hopr/config-server:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8888
          env:
            # eclipse-temurin:25-jre is container-aware by default; cap the heap at a
            # share of the container memory *limit* below, leaving room for metaspace,
            # thread stacks and native buffers.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            {{- toYaml .Values.configServer.resources | nindent 12 }}
          # Removing a pod from the Service endpoints and telling it to shut down happen
          # in parallel, and a starting service's spring.config.import fetch can still be
          # routed here in that window. Sleeping in preStop delays SIGTERM long enough for
          # the deregistration to propagate instead of answering connection-refused.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
