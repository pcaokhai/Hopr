apiVersion: v1
kind: Secret
metadata:
  name: hopr-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  # REQUIRED, no default: the plaintext key the frontend presents to shortener-service.
  # Must be a key whose SHA-256 digest is in config.shortenerApiKeyHashes.
  SHORTEN_API_KEY: {{ .Values.shortenApiKey | quote }}
