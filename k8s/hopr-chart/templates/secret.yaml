apiVersion: v1
kind: Secret
metadata:
  name: hopr-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hopr-frontend-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # REQUIRED, no default: the plaintext key the frontend presents to shortener-service.
  # Must be a key whose SHA-256 digest is in config.shortenerApiKeyHashes. Kept in its own
  # Secret so the backends, which consume hopr-secret wholesale, never hold a usable key.
  SHORTEN_API_KEY: {{ .Values.shortenApiKey | quote }}
