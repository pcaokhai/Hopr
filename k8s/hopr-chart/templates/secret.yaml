apiVersion: v1
kind: Secret
metadata:
  name: hopr-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MONGO_URI: "mongodb://{{ .Values.mongodb.rootUsername }}:{{ .Values.mongodb.rootPassword }}@hopr-mongodb:27017/{{ .Values.mongodb.database }}?authSource=admin"
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
