server:
  port: ${SHORTENER_SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

spring:
  cassandra:
    contact-points: ${SCYLLA_CONTACT_POINTS}
    port: ${SCYLLA_PORT}
    keyspace-name: ${SCYLLA_KEYSPACE}
    local-datacenter: ${SCYLLA_DATACENTER}
    schema-action: none
  data:
    redis:
      port: ${REDIS_PORT}
      cluster:
        nodes:
          - ${REDIS_NODE_1}
          - ${REDIS_NODE_2}
          - ${REDIS_NODE_3}
          - ${REDIS_NODE_4}
          - ${REDIS_NODE_5}
          - ${REDIS_NODE_6}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

shortener:
  domain: ${SHORTENER_DOMAIN}
  api-key:
    # `<sha-256 digest>:<owner-id>` pairs, comma separated: which keys are accepted on
    # /v1/shorten and /v1/links, and whose links each one manages. Only digests are configured:
    # the plaintext keys live with the clients, so this value -- and anything that logs or leaks
    # it -- is useless to an attacker.
    owners: ${SHORTENER_API_KEY_OWNERS}

keygen:
  service:
    url: http://keygen-service:8081

# Guards the blocking keygen-service call. Tuned for a low-traffic learning
# project: a 10-call window with a 5-call minimum so the breaker reacts within
# seconds, but never on a single unlucky call.
resilience4j:
  circuitbreaker:
    instances:
      keygen:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
