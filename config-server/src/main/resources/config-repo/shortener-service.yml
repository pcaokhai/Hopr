server:
  port: ${SHORTENER_SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

spring:
  cassandra:
    contact-points: ${SCYLLA_CONTACT_POINTS}
    port: ${SCYLLA_PORT}
    keyspace-name: ${SCYLLA_KEYSPACE}
    local-datacenter: ${SCYLLA_DATACENTER}
    schema-action: none
  data:
    redis:
      port: ${REDIS_PORT}
      cluster:
        nodes:
          - ${REDIS_NODE_1}
          - ${REDIS_NODE_2}
          - ${REDIS_NODE_3}
          - ${REDIS_NODE_4}
          - ${REDIS_NODE_5}
          - ${REDIS_NODE_6}

shortener:
  domain: ${SHORTENER_DOMAIN}

keygen:
  service:
    url: http://keygen-service:8081

# Guards the blocking keygen-service call. Tuned for a low-traffic learning
# project: a 10-call window with a 5-call minimum so the breaker reacts within
# seconds, but never on a single unlucky call.
resilience4j:
  circuitbreaker:
    instances:
      keygen:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
