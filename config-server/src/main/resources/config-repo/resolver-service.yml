server:
  port: ${RESOLVER_SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  cassandra:
    contact-points: ${SCYLLA_CONTACT_POINTS}
    port: ${SCYLLA_PORT}
    keyspace-name: ${SCYLLA_KEYSPACE}
    local-datacenter: ${SCYLLA_DATACENTER}
    schema-action: none
  data:
    redis:
      port: ${REDIS_PORT}
      cluster:
        nodes:
          - ${REDIS_NODE_1}
          - ${REDIS_NODE_2}
          - ${REDIS_NODE_3}
          - ${REDIS_NODE_4}
          - ${REDIS_NODE_5}
          - ${REDIS_NODE_6}
