server:
  port: ${RESOLVER_SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

spring:
  cassandra:
    contact-points: ${SCYLLA_CONTACT_POINTS}
    port: ${SCYLLA_PORT}
    keyspace-name: ${SCYLLA_KEYSPACE}
    local-datacenter: ${SCYLLA_DATACENTER}
    schema-action: none
  data:
    redis:
      port: ${REDIS_PORT}
      cluster:
        nodes:
          - ${REDIS_NODE_1}
          - ${REDIS_NODE_2}
          - ${REDIS_NODE_3}
          - ${REDIS_NODE_4}
          - ${REDIS_NODE_5}
          - ${REDIS_NODE_6}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
