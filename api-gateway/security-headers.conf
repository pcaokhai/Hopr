# Included by every context that sets its own `add_header`, because nginx's add_header
# inheritance is replace-not-merge: one add_header in a location drops every inherited one.
# One source of truth, pulled into the server block and into each location that adds
# headers of its own.
#
# DEV ONLY HSTS max-age: 300s. The standard production value is 31536000 (one year), but
# this gateway answers for `localhost`, and a year-long pin poisons every other plain-HTTP
# project on the developer's machine. A real deployment on a real domain raises this to one
# year once TLS is proven stable.
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
