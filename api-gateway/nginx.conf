worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
}

http {
    server_tokens off;

    # nginx skips the limiter when the key is empty, which is the only way to exempt a
    # location from an inherited limit_req (there is no `limit_req off`). Static assets are
    # exempt: one page load is a burst of chunks from one address, which would exhaust a
    # budget sized for the write path. Everything else is still keyed on the client address.
    map $uri $limit_key {
        default                                            $binary_remote_addr;
        ~^/_next/                                          "";
        ~^/(?:favicon\.ico|file\.svg|globe\.svg|next\.svg|vercel\.svg|window\.svg)$  "";
    }

    limit_req_zone $limit_key zone=mylimit:10m rate=5r/s;
    limit_req_status 429;

    upstream shortener {
        server shortener-service:8080;
    }

    upstream resolver {
        server resolver-service:8083;
    }

    upstream frontend {
        server frontend:3000;
    }

    # TLS terminates here: this gateway is the only process holding the certificate and
    # private key. It decrypts inbound HTTPS and proxies plain HTTP to the services over
    # the private container network, which never leaves the host.
    #
    # Plain HTTP exists only to bounce clients to HTTPS. 301 (not 302) so browsers cache
    # the upgrade, and no location blocks at all, so nothing is ever served in plaintext.
    server {
        listen 80;
        server_name hopr.localhost localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name hopr.localhost localhost;

        # DEV ONLY: self-signed, generated by api-gateway/generate-dev-cert.sh and mounted
        # in by docker-compose. No client trusts it without an explicit override. A real
        # deployment must mount a CA-issued certificate here instead.
        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        # Sent only over HTTPS (a browser ignores HSTS on a plaintext response anyway), so
        # these live here rather than in the port-80 server above.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        limit_req zone=mylimit burst=10 nodelay;

        location = /shorten {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain charset=UTF-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

            proxy_pass http://shortener;
        }

       location ~ "^/[a-zA-Z0-9_-]{4,}$" {
           proxy_pass http://resolver;
       }

        # The frontend is served from behind this gateway so that its /api/shorten route --
        # which holds the server-side API key -- is rate limited per real client address by
        # the server-level `limit_req` above. Next.js itself sees only this proxy's address.
        # Mounted on paths that cannot collide with the two routes above: `= /shorten` is an
        # exact match and the redirect regex never matches a path containing a slash, while
        # the `= /` and `= /dashboard` exact matches beat it for the two slash-free pages.
        # The `location /` fallback still goes to shortener-service, unchanged.
        location /api/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets: the frontend's build output under /_next/ and the root-level files
        # Next serves directly (favicon.ico and friends). Exempt from the limiter via
        # $limit_key above. Neither form can be claimed by the redirect regex above
        # (slashes and dots are outside its character class).
        location ~ "^/(?:_next/|favicon\.ico$|file\.svg$|globe\.svg$|next\.svg$|vercel\.svg$|window\.svg$)" {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        location /dashboard/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        location = /dashboard {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        location = / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://shortener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}